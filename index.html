<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evaluación de Salud Respiratoria — Rafael Quintana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --teal:        #14545A;
  --teal-mid:    #2E7177;
  --teal-light:  #E3EEEC;
  --teal-pale:   #EEF4F3;
  --coral:       #C2734A;
  --coral-mid:   #D89066;
  --coral-light: #F7EADF;
  --coral-pale:  #FBF3EC;
  --ink:         #1C2628;
  --ink-soft:    #3D3D3F;
  --ink-muted:   #6B6B6E;
  --ink-faint:   #A0A0A3;
  --cream:       #F8F3EA;
  --cream-warm:  #EFE7D8;
  --white:       #FDFCFA;
  --border:      rgba(20,84,90,0.12);
  --border-mid:  rgba(20,84,90,0.2);
  --mind-color:  #2E5FA3;
  --mind-bg:     #EEF2FA;
  --mind-dark:   #1A3D6E;
  --body-color:  #14545A;
  --body-bg:     #E3EEEC;
  --body-dark:   #0D3B3E;
  --sport-color: #C2734A;
  --sport-bg:    #F7EADF;
  --sport-dark:  #AC5F38;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-xl: 22px;
}

html { scroll-behavior: smooth; }

body {
  background: var(--cream);
  color: var(--ink);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  padding: 2.5rem 1rem 5rem;
  line-height: 1.6;
}

#app { max-width: 600px; margin: 0 auto; }

.brand-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 2rem;
  padding-bottom: 1.2rem;
  border-bottom: 1px solid var(--border);
}
.brand-name {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 17px;
  font-weight: 500;
  color: var(--teal);
  letter-spacing: .2px;
}
.brand-handle {
  font-size: 11px;
  color: var(--ink-faint);
  font-weight: 400;
  letter-spacing: .3px;
}
.brand-dot {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--teal);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.brand-dot svg { width: 18px; height: 18px; fill: none; stroke: #fff; stroke-width: 1.8; }

.intro-wrap {
  border-radius: var(--radius-xl);
  overflow: hidden;
  border: 1px solid var(--border);
  box-shadow: 0 2px 24px rgba(20,84,90,0.07);
}
.intro-hero {
  background: var(--teal);
  padding: 3rem 2.2rem 2.5rem;
  position: relative;
  overflow: hidden;
}
.intro-hero::before {
  content: '';
  position: absolute;
  width: 300px; height: 300px;
  border-radius: 50%;
  background: rgba(255,255,255,.04);
  top: -100px; right: -80px;
}
.intro-hero::after {
  content: '';
  position: absolute;
  width: 160px; height: 160px;
  border-radius: 50%;
  background: rgba(194,115,74,.15);
  bottom: -50px; left: -30px;
}
.intro-eyebrow {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: rgba(255,255,255,.55);
  margin-bottom: 14px;
  position: relative; z-index: 1;
}
.intro-hero h1 {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 34px;
  font-weight: 500;
  color: #fff;
  line-height: 1.2;
  margin-bottom: 14px;
  position: relative; z-index: 1;
}
.intro-hero p {
  font-size: 14px;
  color: rgba(255,255,255,.65);
  line-height: 1.7;
  max-width: 380px;
  position: relative; z-index: 1;
}
.intro-body {
  background: var(--white);
  padding: 2rem 2.2rem 2.2rem;
}
.pillars-intro {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  margin-bottom: 1.8rem;
}
.pi-item {
  padding: 1rem .8rem;
  border-radius: var(--radius-md);
  text-align: center;
  border: 1px solid var(--border);
  background: var(--cream);
}
.pi-icon { font-size: 20px; margin-bottom: 6px; }
.pi-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .8px;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.pi-desc { font-size: 11px; color: var(--ink-muted); line-height: 1.4; }

.start-btn {
  width: 100%;
  padding: 14px;
  border-radius: var(--radius-md);
  background: var(--teal);
  color: #fff;
  border: none;
  cursor: pointer;
  font-size: 15px;
  font-weight: 600;
  font-family: 'DM Sans', sans-serif;
  letter-spacing: .2px;
  transition: background .2s, transform .1s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 1rem;
}
.start-btn:hover  { background: #0A4A50; }
.start-btn:active { transform: scale(.99); }
.privacy-note {
  font-size: 11px;
  color: var(--ink-faint);
  text-align: center;
  margin-top: 10px;
  letter-spacing: .2px;
}

.progress-wrap { margin-bottom: 1.6rem; }
.progress-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
.progress-pillar {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .6px;
  text-transform: uppercase;
}
.progress-count { font-size: 12px; color: var(--ink-muted); }
.progress-bar {
  height: 2px;
  background: var(--cream-warm);
  border-radius: 1px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  border-radius: 1px;
  transition: width .45s cubic-bezier(.4,0,.2,1);
}

.q-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  padding: 2rem 2rem 1.6rem;
  box-shadow: 0 2px 20px rgba(20,84,90,.05);
}
.q-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 10px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 20px;
  margin-bottom: 1.2rem;
  letter-spacing: .6px;
  text-transform: uppercase;
}
.q-text {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 22px;
  font-weight: 500;
  color: var(--ink);
  margin-bottom: 1.4rem;
  line-height: 1.4;
}
.q-sub {
  font-size: 12px;
  color: var(--ink-muted);
  margin: -0.8rem 0 1.2rem;
  line-height: 1.65;
  padding: 10px 14px;
  background: var(--teal-pale);
  border-radius: var(--radius-sm);
  border-left: 2px solid var(--teal-mid);
}

.options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 1.5rem; }
.opt-btn {
  padding: 13px 14px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-mid);
  background: var(--cream);
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: all .15s;
  font-size: 13px;
  font-weight: 400;
  color: var(--ink);
  font-family: 'DM Sans', sans-serif;
  text-align: left;
}
.opt-btn:hover { background: var(--teal-pale); border-color: var(--teal-mid); }
.opt-btn.selected {
  border-color: var(--teal);
  background: var(--teal);
  color: #fff;
}
.opt-btn .pts {
  font-size: 10px;
  font-weight: 600;
  color: var(--ink-faint);
  margin-left: 6px;
  white-space: nowrap;
  opacity: .7;
}
.opt-btn.selected .pts { color: rgba(255,255,255,.6); }

.nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: .8rem;
  border-top: 1px solid var(--border);
}
.btn-back {
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-muted);
  background: none;
  border: none;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  padding: 8px 0;
  display: flex;
  align-items: center;
  gap: 5px;
}
.btn-back:hover { color: var(--ink); }
.btn-next {
  font-size: 13px;
  font-weight: 600;
  padding: 10px 22px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-mid);
  background: var(--white);
  cursor: pointer;
  transition: all .15s;
  color: var(--ink);
  font-family: 'DM Sans', sans-serif;
  display: flex;
  align-items: center;
  gap: 6px;
}
.btn-next:hover:not(:disabled) { background: var(--cream); }
.btn-next.active {
  background: var(--teal);
  border-color: var(--teal);
  color: #fff;
}
.btn-next:disabled { opacity: .3; cursor: not-allowed; }

.score-hero {
  background: var(--teal);
  border-radius: var(--radius-xl);
  padding: 2.5rem 2rem 2.2rem;
  text-align: center;
  margin-bottom: 1rem;
  position: relative;
  overflow: hidden;
  box-shadow: 0 4px 30px rgba(20,84,90,.2);
}
.score-hero::before {
  content: '';
  position: absolute;
  width: 260px; height: 260px; border-radius: 50%;
  background: rgba(255,255,255,.04);
  top: -80px; right: -60px;
}
.score-hero::after {
  content: '';
  position: absolute;
  width: 140px; height: 140px; border-radius: 50%;
  background: rgba(194,115,74,.18);
  bottom: -40px; left: 20px;
}
.score-eyebrow {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1.4px;
  text-transform: uppercase;
  color: rgba(255,255,255,.5);
  margin-bottom: 12px;
  position: relative; z-index: 1;
}
.score-number {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 82px;
  font-weight: 400;
  color: #fff;
  line-height: 1;
  position: relative; z-index: 1;
}
.score-denom {
  font-size: 20px;
  color: rgba(255,255,255,.4);
  font-family: 'DM Sans', sans-serif;
  font-weight: 300;
}
.score-level-badge {
  display: inline-block;
  margin-top: 14px;
  padding: 5px 18px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  font-family: 'DM Sans', sans-serif;
  letter-spacing: .4px;
  position: relative; z-index: 1;
}

.pillars-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 1rem; }
.p-card {
  padding: 1.1rem 1rem;
  border-radius: var(--radius-lg);
  border: 1px solid var(--border);
  background: var(--white);
  text-align: center;
  box-shadow: 0 1px 8px rgba(20,84,90,.04);
}
.p-name {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .6px;
  margin-bottom: 5px;
}
.p-score {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 32px;
  font-weight: 500;
  line-height: 1;
}
.p-denom { font-size: 14px; color: var(--ink-muted); font-family: 'DM Sans', sans-serif; font-weight: 300; }
.p-badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 10px;
  margin-top: 6px;
  letter-spacing: .3px;
}
.p-bar-wrap { height: 2px; border-radius: 1px; margin-top: 10px; background: var(--cream-warm); }
.p-bar-fill { height: 100%; border-radius: 1px; }

.section-heading {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--ink-faint);
  margin: 1.8rem 0 .9rem;
}

.radar-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.4rem;
  margin-bottom: 1rem;
  text-align: center;
}

.interp-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.4rem 1.6rem;
  margin-bottom: 8px;
  box-shadow: 0 1px 6px rgba(20,84,90,.03);
}
.interp-card h4 {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 17px;
  font-weight: 500;
  margin-bottom: 7px;
}
.interp-card p {
  font-size: 13px;
  color: var(--ink-muted);
  line-height: 1.7;
}

.imt-card {
  background: var(--teal-pale);
  border: 1px solid rgba(20,84,90,.15);
  border-radius: var(--radius-lg);
  padding: 1.4rem 1.6rem;
  margin-bottom: 8px;
}
.imt-card h4 {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 17px;
  font-weight: 500;
  color: var(--teal);
  margin-bottom: 10px;
}
.imt-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.imt-tag {
  font-size: 11px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 6px;
  background: var(--white);
  color: var(--teal);
  border: 1px solid rgba(20,84,90,.15);
  display: flex;
  align-items: center;
  gap: 4px;
}
.imt-card p { font-size: 13px; color: var(--ink-soft); line-height: 1.7; }

/* ── CTA Card — dynamic per profile ── */
.cta-card {
  background: var(--teal);
  border-radius: var(--radius-xl);
  padding: 2.2rem 2rem;
  margin-top: 1.4rem;
  position: relative;
  overflow: hidden;
  box-shadow: 0 6px 40px rgba(20,84,90,.22);
}
.cta-card::before {
  content: '';
  position: absolute;
  width: 240px; height: 240px; border-radius: 50%;
  background: rgba(255,255,255,.04);
  top: -80px; right: -60px;
}
.cta-card::after {
  content: '';
  position: absolute;
  width: 120px; height: 120px; border-radius: 50%;
  background: rgba(194,115,74,.18);
  bottom: -30px; left: 10px;
}
.cta-eyebrow {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1.4px;
  text-transform: uppercase;
  color: rgba(255,255,255,.5);
  margin-bottom: 10px;
  position: relative; z-index: 1;
}
.cta-card h3 {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 26px;
  font-weight: 500;
  color: #fff;
  margin-bottom: 10px;
  line-height: 1.25;
  position: relative; z-index: 1;
}
.cta-sub {
  font-size: 13px;
  color: rgba(255,255,255,.65);
  line-height: 1.7;
  margin-bottom: 1.4rem;
  position: relative; z-index: 1;
}
.cta-bullets { list-style: none; margin-bottom: 1.6rem; position: relative; z-index: 1; }
.cta-bullets li {
  font-size: 13px;
  color: rgba(255,255,255,.82);
  padding: 4px 0;
  display: flex;
  align-items: flex-start;
  gap: 9px;
  line-height: 1.55;
}
.cta-check {
  width: 16px; height: 16px;
  border-radius: 50%;
  background: rgba(255,255,255,.15);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  margin-top: 1px;
  font-size: 9px;
  font-weight: 700;
  color: #9FE1CB;
}
.cta-divider {
  border: none;
  border-top: 1px solid rgba(255,255,255,.1);
  margin: 1.4rem 0 1.2rem;
  position: relative; z-index: 1;
}

/* Lead capture section */
.lead-capture {
  position: relative; z-index: 1;
}
.lead-capture-label {
  font-size: 12px;
  font-weight: 600;
  color: rgba(255,255,255,.7);
  margin-bottom: 8px;
  letter-spacing: .2px;
}
.lead-input-row {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
}
.lead-email-input {
  flex: 1;
  padding: 12px 14px;
  border-radius: var(--radius-md);
  border: 1px solid rgba(255,255,255,.22);
  background: rgba(255,255,255,.1);
  font-size: 13px;
  color: #fff;
  font-family: 'DM Sans', sans-serif;
  outline: none;
  transition: border-color .15s, background .15s;
}
.lead-email-input::placeholder { color: rgba(255,255,255,.4); }
.lead-email-input:focus { border-color: rgba(255,255,255,.5); background: rgba(255,255,255,.14); }
.lead-send-btn {
  padding: 12px 16px;
  border-radius: var(--radius-md);
  background: rgba(255,255,255,.15);
  color: #fff;
  border: 1px solid rgba(255,255,255,.25);
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  font-family: 'DM Sans', sans-serif;
  white-space: nowrap;
  transition: background .15s;
  display: flex; align-items: center; gap: 6px;
}
.lead-send-btn:hover { background: rgba(255,255,255,.22); }
.lead-send-btn:disabled { opacity: .5; cursor: not-allowed; }
.success-msg {
  font-size: 12px; color: #9FE1CB; margin-bottom: 12px;
  position: relative; z-index: 1; display: flex; align-items: center; gap: 6px;
}
.error-msg {
  font-size: 12px; color: #FFAA99; margin-bottom: 12px;
  position: relative; z-index: 1; display: flex; align-items: center; gap: 6px;
}

/* WhatsApp CTA button — single prominent action */
.whatsapp-btn {
  width: 100%;
  padding: 15px;
  border-radius: var(--radius-md);
  background: #25D366;
  color: #fff;
  border: none;
  cursor: pointer;
  font-size: 15px;
  font-weight: 700;
  font-family: 'DM Sans', sans-serif;
  letter-spacing: .2px;
  transition: background .2s, transform .1s;
  display: flex; align-items: center; justify-content: center; gap: 9px;
  position: relative; z-index: 1;
  margin-bottom: 10px;
}
.whatsapp-btn:hover { background: #1ebe5a; }
.whatsapp-btn:active { transform: scale(.99); }

.pdf-btn-secondary {
  width: 100%;
  padding: 12px;
  border-radius: var(--radius-md);
  background: transparent;
  color: rgba(255,255,255,.7);
  border: 1px solid rgba(255,255,255,.2);
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  font-family: 'DM Sans', sans-serif;
  transition: background .15s, color .15s;
  display: flex; align-items: center; justify-content: center; gap: 7px;
  position: relative; z-index: 1;
}
.pdf-btn-secondary:hover { background: rgba(255,255,255,.08); color: #fff; }

.brand-footer {
  text-align: center;
  margin-top: 2rem;
  font-size: 11px;
  color: var(--ink-faint);
  letter-spacing: .3px;
}
.brand-footer strong { font-weight: 600; color: var(--teal); }

.restart-btn {
  display: block;
  margin: 1.4rem auto 0;
  font-size: 12px;
  color: var(--ink-faint);
  background: none;
  border: none;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  letter-spacing: .2px;
}
.restart-btn:hover { color: var(--ink-muted); }

@media (max-width: 480px) {
  body { padding: 1.5rem .75rem 4rem; }
  .pillars-intro  { grid-template-columns: 1fr; }
  .pillars-row    { grid-template-columns: 1fr; }
  .options-grid   { grid-template-columns: 1fr; }
  .intro-hero h1  { font-size: 26px; }
  .score-number   { font-size: 64px; }
  .cta-card h3    { font-size: 22px; }
  .q-text         { font-size: 19px; }
  .intro-hero { padding: 2.2rem 1.5rem 2rem; }
  .intro-body { padding: 1.5rem; }
  .q-card { padding: 1.5rem 1.2rem 1.2rem; }
}
</style>
</head>
<body>
<div id="app">

  <div class="brand-header">
    <div>
      <div class="brand-name">Rafael Quintana</div>
      <div class="brand-handle">Terapia Respiratoria · @terapiarespiratoria_rq</div>
    </div>
    <div class="brand-dot">
      <!-- Lung icon -->
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v7"/>
        <path d="M12 10c0 0-5 1-6 5s0 6 3 6 4-3 3-6"/>
        <path d="M12 10c0 0 5 1 6 5s0 6-3 6-4-3-3-6"/>
      </svg>
    </div>
  </div>

  <div id="screen"></div>

  <div class="brand-footer">
    <strong>Rafael Quintana</strong> · Terapia Respiratoria · @terapiarespiratoria_rq
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* ─────────────────────────────────────────

function calcScores() {
  const s = { mind:0, body:0, sport:0 };
  QS.forEach((q,i) => { if (answers[i] !== null) s[q.p] += answers[i]; });
  return s;
}

function levelInfo(score, max) {
  const r = score / max;
  if (r >= 0.80) return { label:'Avanzado',     bg:'#EAF3DE', color:'#27500A' };
  if (r >= 0.55) return { label:'Construyendo', bg:'#FEF3E2', color:'#7A4800' };
  return               { label:'Inicial',      bg:'#FDECEA', color:'#7A1F1F' };
}

// Detecta si el usuario es más atleta o paciente
function detectProfileType(s) {
  return s.sport >= 9 ? 'atleta' : 'paciente';
}

function imtRec(s) {
  const total = s.mind + s.body + s.sport;
  const bolt  = answers[9] ?? 0;
  if (total <= 20 || bolt <= 1) return {
    phase:'Fase 1 — Iniciación',
    sessions:'30',
    freq:'2 veces/día · 30 respiraciones',
    load:'Carga: 30 % de tu PIM',
    weeks:'~4 semanas',
    detail:'El punto de partida es enseñarle a tu sistema nervioso y a tus músculos respiratorios a trabajar con cargas bajas, corrigiendo la forma en que mueves el diafragma y construyendo tolerancia de forma segura. Avanzar demasiado rápido genera fatiga sin adaptación real.'
  };
  if (total <= 32 || bolt <= 2) return {
    phase:'Fase 2 — Desarrollo',
    sessions:'20–24',
    freq:'1–2 veces/día · 30 respiraciones',
    load:'Carga: 50 % PIM con progresión del 5 % semanal',
    weeks:'~3–4 semanas',
    detail:'Diseñada para deportistas recreativos y personas con capacidad física moderada. Trabajar al 50% de tu fuerza máxima respiratoria genera las adaptaciones musculares más importantes sin generar fatiga excesiva del diafragma.'
  };
  return {
    phase:'Fase 3 — Alto Rendimiento',
    sessions:'12–16',
    freq:'1 vez/día · 30 respiraciones',
    load:'Carga: 60–80 % PIM · protocolo de alta intensidad',
    weeks:'~2–3 semanas',
    detail:'Para atletas con una base respiratoria sólida. Trabajar a alta intensidad mejora significativamente la eficiencia con la que respiras, retrasa la fatiga muscular y acelera tu recuperación después del esfuerzo.'
  };
}

async function saveLead(email) {
  const s           = calcScores();
  const tot         = s.mind + s.body + s.sport;
  const lvl         = levelInfo(tot, 45);
  const profileType = detectProfileType(s);
  const fecha       = new Date().toLocaleString('es-VE', { timeZone: 'America/Caracas' });

  // Mensaje personalizado según perfil para el correo al lead
  const mensajePerfil = profileType === 'atleta'
    ? `Tu perfil es de atleta. Basado en tus resultados, hay margen real para mejorar tu rendimiento desde la respiración. Un protocolo estructurado puede marcar una diferencia concreta en tu resistencia, recuperación y tiempos.`
    : tot >= 33
    ? `Tu nivel es Avanzado — tienes una base sólida. Una evaluación de seguimiento periódica te ayudará a mantener y seguir mejorando lo que ya has construido.`
    : tot >= 18
    ? `Tu nivel es intermedio. Hay patrones concretos que trabajar. Con un programa de 6 a 8 semanas puedes sentir una diferencia real en cómo respiras en tu día a día y bajo esfuerzo.`
    : `Tus resultados muestran un punto de partida claro. Hay mucho terreno por ganar — y los cambios con trabajo estructurado pueden notarse en pocas semanas.`;

  // 1. Google Sheets (base de datos)
  if (SHEETS_WEBHOOK_URL && SHEETS_WEBHOOK_URL !== 'TU_GOOGLE_APPS_SCRIPT_URL') {
    try {
      await fetch(SHEETS_WEBHOOK_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email,
          score_total: tot,
          nivel: lvl.label,
          mente: s.mind,
          cuerpo: s.body,
          deporte: s.sport,
          perfil: profileType,
          fecha
        })
      });
    } catch(e) { console.warn('Sheets error:', e); }
  }

  // 2. EmailJS — alerta a Rafael
  if (EMAILJS_PUBLIC_KEY !== 'TU_PUBLIC_KEY') {
    try {
      await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
        lead_email:   email,
        score_total:  String(tot) + ' / 45',
        nivel:        lvl.label,
        mente:        s.mind + '/15',
        cuerpo:       s.body + '/15',
        deporte:      s.sport + '/15',
        perfil_tipo:  profileType,
        fecha
      }, EMAILJS_PUBLIC_KEY);
    } catch(e) { console.warn('EmailJS alerta error:', e); }

    // 3. EmailJS — reporte al lead
    try {
      await emailjs.send(EMAILJS_SERVICE_ID, 'template_xn1h0f6', {
        lead_email:     email,
        score_total:    String(tot) + ' / 45',
        nivel:          lvl.label,
        mente:          s.mind + '/15',
        cuerpo:         s.body + '/15',
        deporte:        s.sport + '/15',
        mensaje_perfil: mensajePerfil,
        fecha
      }, EMAILJS_PUBLIC_KEY);
    } catch(e) { console.warn('EmailJS lead error:', e); }
  }
}

function renderQuestion(idx) {
  const q   = QS[idx];
  const pl  = PILLARS.find(p => p.id === q.p);
  const pct = Math.round((idx / 15) * 100);
  const opts = getOpts(q);
  const sel  = answers[idx];

  return `
  <div class="progress-wrap">
    <div class="progress-meta">
      <span class="progress-pillar" style="color:${pl.dark}">${pl.name}</span>
      <span class="progress-count">${idx + 1} / 15 · ${pct}%</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" style="width:${pct}%; background:${pl.color}"></div>
    </div>
  </div>
  <div class="q-card">
    <div class="q-pill" style="background:${pl.bg}; color:${pl.dark}">
      <span>●</span> ${pl.name.toUpperCase()}
    </div>
    <p class="q-text">${q.t}</p>
    ${q.sub ? `<p class="q-sub">${q.sub}</p>` : ''}
    <div class="options-grid">
      ${opts.map((o, i) => `
        <button class="opt-btn ${sel === i ? 'selected' : ''}"
          onclick="selectOpt(${idx}, ${i})"
          style="${sel === i ? `background:${pl.color};border-color:${pl.color};` : ''}">
          <span>${o}</span>
          <span class="pts">${i}pt${i !== 1 ? 's' : ''}</span>
        </button>`).join('')}
    </div>
    <div class="nav">
      <button class="btn-back" onclick="goBack(${idx})">
        ${idx > 0 ? `<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9 2L4 7l5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg> Atrás` : ''}
      </button>
      <button class="btn-next ${sel !== null ? 'active' : ''}"
        onclick="goNext(${idx})" ${sel === null ? 'disabled' : ''}>
        ${idx < 14 ? 'Siguiente' : 'Ver mi reporte'}
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M5 2l5 5-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>`;
}

function renderResults() {
  const s           = calcScores();
  const tot         = s.mind + s.body + s.sport;
  const lvl         = levelInfo(tot, 45);
  const imt         = imtRec(s);

  const cta         = ctaContent(s, profileType);

  const waLink = `https://wa.me/584142238924?text=${cta.waMsg}`;

  const pillsHTML = PILLARS.map(pl => {
    const sc = s[pl.id];
    const lv = levelInfo(sc, 15);
    const bw = Math.round((sc / 15) * 100);
    return `
    <div class="p-card">
      <div class="p-name" style="color:${pl.dark}">${pl.name}</div>
      <div class="p-score" style="color:${pl.color}">${sc}<span class="p-denom">/15</span></div>
      <span class="p-badge" style="background:${lv.bg};color:${lv.color}">${lv.label}</span>
      <div class="p-bar-wrap"><div class="p-bar-fill" style="width:${bw}%;background:${pl.bar}"></div></div>
    </div>`;
  }).join('');

  const interpHTML = PILLARS.map(pl => {
    const sc = s[pl.id];
    return `
    <div class="interp-card">
      <h4 style="color:${pl.color}">${pl.name} <span style="color:var(--ink-muted);font-weight:400;font-size:15px">— ${levelInfo(sc, 15).label}</span></h4>
      <p>${interpText(pl.id, sc)}</p>
    </div>`;

  return `
  <div class="results">

      <div class="score-eyebrow">Índice de Salud Respiratoria</div>

        <span class="score-denom"> / 45</span>

      <span class="score-level-badge" style="background:${lvl.bg};color:${lvl.color}">${lvl.label}</span>

    <div class="radar-card">

    <div class="cta-card">

      <p class="cta-sub">${cta.sub}</p>
      <ul class="cta-bullets">
        ${cta.bullets.map(b => `<li><span class="cta-check">✓</span>${b}</li>`).join('')}
      </ul>

      <hr class="cta-divider">

      <div class="lead-capture">
        <div class="lead-capture-label">Recibe tu reporte completo en tu correo</div>
        <div class="lead-input-row">
          <input class="lead-email-input" type="email" id="leadEmailInput" placeholder="tu@correo.com" />
          <button class="lead-send-btn" id="leadSendBtn" onclick="handleLeadCapture()">

/* ─────────────────────────────────────────
   LEAD CAPTURE HANDLER
───────────────────────────────────────── */
async function handleLeadCapture() {
  const emailEl  = document.getElementById('leadEmailInput');
  const btn      = document.getElementById('leadSendBtn');
  const successEl = document.getElementById('leadSuccessMsg');
  const errorEl   = document.getElementById('leadErrorMsg');

  const email = emailEl ? emailEl.value.trim() : '';
  if (!email || !email.includes('@')) {
    if (errorEl) { errorEl.style.display = 'flex'; errorEl.textContent = 'Ingresa un correo válido para continuar.'; }
    return;
  }
  if (errorEl) errorEl.style.display = 'none';

  if (btn) { btn.disabled = true; btn.textContent = 'Guardando…'; }

  await saveLead(email);
  leadSaved = true;

  if (successEl) successEl.style.display = 'flex';
  if (btn) { btn.disabled = true; btn.textContent = '✓ Enviado'; }

  // Auto-download PDF after lead saved
  setTimeout(() => downloadPDF(), 800);
}

/* ─────────────────────────────────────────
   STATE HANDLERS
───────────────────────────────────────── */
function startQuiz() { current = 0; phase = 'quiz'; render(); }

function selectOpt(idx, val) { answers[idx] = val; render(); }

function goBack(idx) {
  if (idx > 0) { current = idx - 1; render(); }
  else { phase = 'intro'; render(); }
}

function goNext(idx) {
  if (answers[idx] === null) return;
  if (idx < 14) { current = idx + 1; render(); }
  else { phase = 'results'; render(); }
}

function restart() {
  answers = new Array(15).fill(null);
  current = 0; phase = 'intro'; leadSaved = false; render();
}

/* ─────────────────────────────────────────
   CONEXIÓN CON LA FICHA DEPORTIVA
   Guarda el resultado en este navegador para que
   ralejql-ai.github.io/ficha/ lo lea (mismo dominio).
───────────────────────────────────────── */
function saveForFicha() {
  try {
    const s   = calcScores();
    const tot = s.mind + s.body + s.sport;
    localStorage.setItem('rq-assessment-v1', JSON.stringify({
      v: 1,
      fecha:  new Date().toISOString(),
      scores: { mind: s.mind, body: s.body, sport: s.sport, total: tot },
      nivel:  levelInfo(tot, 45).label,
      perfil: detectProfileType(s),
      imt:    imtRec(s).phase,
      bolt:   answers[9]  !== null ? getOpts(QS[9])[answers[9]]  : '',
      mbt:    answers[13] !== null ? getOpts(QS[13])[answers[13]] : '',
      answers: answers.slice()
    }));
  } catch (e) { /* sin almacenamiento disponible: la ficha simplemente no lo precarga */ }
}

/* ─────────────────────────────────────────
   MAIN RENDER
───────────────────────────────────────── */
function render() {
  const sc = document.getElementById('screen');
  if (phase === 'intro') { sc.innerHTML = renderIntro(); return; }
  if (phase === 'quiz')  { sc.innerHTML = renderQuestion(current); return; }
  if (phase === 'results') {
    saveForFicha();
    sc.innerHTML = renderResults();
    if (radarChart) { radarChart.destroy(); radarChart = null; }
    const s = calcScores();
    radarChart = new Chart(document.getElementById('radarChart'), {
      type: 'radar',
      data: {
        labels: ['Mente','Cuerpo','Deporte'],
        datasets: [{
          label: 'Tu perfil',
          data: [s.mind, s.body, s.sport],
          backgroundColor: 'rgba(20,84,90,.12)',
          borderColor: '#14545A',
          pointBackgroundColor: '#C2734A',
          pointBorderColor: '#fff',
          pointBorderWidth: 1.5,
          pointRadius: 5,
          borderWidth: 2
        }]
      },
      options: {
        responsive: false,
        plugins: { legend: { display: false } },
        scales: {
          r: {
            min: 0, max: 15,
            ticks: { stepSize: 5, font: { size: 10 }, color: '#A0A0A3' },
            grid:  { color: 'rgba(20,84,90,.1)' },
            pointLabels: { font: { size: 13, family: 'DM Sans' }, color: '#3D3D3F' }
          }
        }
      }
    });
  }
}

render();
</script>

function doPost(e) {
  const sheet = SpreadsheetApp.openById('ID_DE_TU_GOOGLE_SHEET').getSheetByName('Leads');
  const data  = JSON.parse(e.postData.contents);

  // Si es la primera vez, agrega encabezados
  if (sheet.getLastRow() === 0) {
    sheet.appendRow(['Fecha', 'Email', 'Score Total', 'Nivel', 'Mente', 'Cuerpo', 'Deporte', 'Perfil']);
  }

  sheet.appendRow([
    data.fecha,
    data.email,
    data.score_total,
    data.nivel,
    data.mente,
    data.cuerpo,
    data.deporte,
    data.perfil
  ]);

  return ContentService
    .createTextOutput(JSON.stringify({ status: 'ok' }))
    .setMimeType(ContentService.MimeType.JSON);
}
